# Local stack in containers. Secrets come from .env (see .env.example; run `make setup` first).
# The runtime role password is taken from DATABASE_URL in .env via RUNTIME_DB_PASSWORD below.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: oneledger
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:54330:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oneledger"]
      interval: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: .env
    environment: &dbenv
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/oneledger
      DATABASE_URL: postgresql+psycopg://oneledger_runtime:${RUNTIME_DB_PASSWORD:-change-me-runtime}@db:5432/oneledger
    command: ["sh", "-c", "alembic upgrade head && oneledger-admin setup-db-role"]
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: .env
    environment:
      <<: *dbenv
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: .env
    environment:
      <<: *dbenv
    command: ["oneledger-worker"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    env_file: .env
    environment:
      ONELEDGER_API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
