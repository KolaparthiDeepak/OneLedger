[project]
name = "oneledger"
version = "0.1.0"
description = "OneLedger personal finance platform (workspace root)"
requires-python = ">=3.12"
dependencies = [
    "oneledger-shared",
    "oneledger-domain",
    "oneledger-categorization",
    "oneledger-providers",
    "oneledger-db",
    "oneledger-api",
    "oneledger-mcp",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-openpyxl",
    "xlwt>=1.3.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/mcp"]

[tool.uv.sources]
oneledger-shared = { workspace = true }
oneledger-domain = { workspace = true }
oneledger-categorization = { workspace = true }
oneledger-providers = { workspace = true }
oneledger-db = { workspace = true }
oneledger-api = { workspace = true }
oneledger-mcp = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/web", "infrastructure/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "DTZ"]
ignore = ["S101", "RUF012", "B008", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ", "B", "E501"]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["apps/web", "infrastructure/migrations/versions", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires PostgreSQL (TEST_DATABASE_URL)",
]
