[project]
name = "oneledger-mcp"
version = "0.1.0"
description = "OneLedger read-only MCP server (stdio)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.scripts]
oneledger-mcp = "oneledger_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oneledger_mcp"]
