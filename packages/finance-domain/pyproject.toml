[project]
name = "oneledger-domain"
version = "0.1.0"
description = "Pure financial domain calculations for OneLedger"
requires-python = ">=3.12"
dependencies = [
    "oneledger-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oneledger_domain"]
