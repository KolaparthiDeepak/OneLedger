[project]
name = "oneledger-db"
version = "0.1.0"
description = "ORM models and database sessions for OneLedger"
requires-python = ">=3.12"
dependencies = [
    "oneledger-shared",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oneledger_db"]
