[project]
name = "oneledger-shared"
version = "0.1.0"
description = "Shared configuration, errors, crypto and logging for OneLedger"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oneledger_shared"]
